name: Build MSYS-only portable

on:
  push:
    branches: [main]
    tags: ['v*', 'c*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          release: true
          update: true
          cache: false
          install: >-
            curl
            wget
            git
            make
            openssh
            vim

      - name: Customize the fresh MSYS installation
        shell: msys2 {0}
        run: bash scripts/customize.sh

      - name: Archive portable installation
        id: archive
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $version = $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          }
          $archive = Join-Path $env:RUNNER_TEMP "msys2-portable-$version-msys-x86_64.zip"
          Push-Location $env:MSYS2_ROOT
          try {
            # Exclude the build account's files and temporary data.
            & 7z a -tzip $archive '.\*' '-x!home\*' '-x!tmp\*' '-x!var\log\*'
            if ($LASTEXITCODE -ne 0) { throw 'Archive creation failed.' }
          } finally {
            Pop-Location
          }
          & 7z t $archive
          if ($LASTEXITCODE -ne 0) { throw 'Archive integrity check failed.' }
          "path=$archive" >> $env:GITHUB_OUTPUT

      - name: Test the extracted package using bash.exe
        shell: pwsh
        env:
          MSYS2_ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'msys2-portable-test'
          & 7z x $env:MSYS2_ARCHIVE "-o$root" -y
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed.' }
          & ./scripts/test-package.ps1 -Root $root

      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: msys2-portable-msys-x86_64
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msys2-portable-msys-x86_64
          path: dist

      - name: Release tested package
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*.zip
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
